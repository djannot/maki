[package]
name = "maki-code-index-mcp"
version.workspace = true
edition.workspace = true
description = "MCP server exposing maki-code-index as a single `index` tool"
license = "MIT"
repository = "https://github.com/tontinton/maki"

[[bin]]
name = "maki-code-index-mcp"
path = "src/main.rs"

[dependencies]
maki-code-index = { workspace = true }
rmcp = { version = "1.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
